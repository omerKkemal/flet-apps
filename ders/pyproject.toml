[project]
name = "ders"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13,<3.14"

authors = [
    { name = "Flet developer", email = "you@example.com" }
]

dependencies = [
    "flet>=0.86.5",
    "requests>=2.31.0",
    "pymupdf>=1.23.0"
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    "flet[test]>=0.86.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
desktop_flavor = "light"
org = "com.mycompany"
product = "ders"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"

[tool.flet.android]
target_arch = "arm64-v8a"
split_per_abi = false

[tool.flet.splash]
color = "#FFFFFF"
dark_color = "#121212"