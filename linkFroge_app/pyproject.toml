[project]
name = "linkfroge"
version = "0.1.0"
description = "Flet desktop GUI for LinkFroge CLI – permanent links for ngrok tunnels."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Omer Kemal", email = "omerkemal2019@gmail.com" }
]
dependencies = [
    "flet>=0.86.1",
    "requests>=2.28.0",
    "tqdm>=4.65.0"
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.1",
    "flet-desktop>=0.86.1",
    "flet-web>=0.86.1",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "com.OK.linkfroge"
product = "linkfroge"
company = "O.K"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"